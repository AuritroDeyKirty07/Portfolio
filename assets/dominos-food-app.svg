<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="food-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="60%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0b0e17"/>
    </linearGradient>
    <linearGradient id="dominos-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006491"/>
      <stop offset="100%" stop-color="#004666"/>
    </linearGradient>
    <linearGradient id="dominos-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e31837"/>
      <stop offset="100%" stop-color="#b0132b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#food-bg)"/>

  <!-- Geometric accent lines -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1.5">
    <circle cx="400" cy="180" r="140" fill="none"/>
    <circle cx="400" cy="180" r="90" fill="none"/>
  </g>

  <!-- Domino Tiles representing RBAC / Modularity -->
  <g transform="translate(340, 110) rotate(-15 60 70)">
    <rect x="0" y="0" width="60" height="120" rx="10" fill="url(#dominos-blue)" stroke="#ffffff" stroke-width="2"/>
    <line x1="0" y1="60" x2="60" y2="60" stroke="#ffffff" stroke-width="2"/>
    <circle cx="30" cy="30" r="7" fill="#ffffff"/>
    <circle cx="20" cy="80" r="7" fill="#ffffff"/>
    <circle cx="40" cy="100" r="7" fill="#ffffff"/>
  </g>

  <g transform="translate(410, 125) rotate(15 60 70)">
    <rect x="0" y="0" width="60" height="120" rx="10" fill="url(#dominos-red)" stroke="#ffffff" stroke-width="2"/>
    <line x1="0" y1="60" x2="60" y2="60" stroke="#ffffff" stroke-width="2"/>
    <circle cx="20" cy="20" r="7" fill="#ffffff"/>
    <circle cx="40" cy="40" r="7" fill="#ffffff"/>
    <circle cx="30" cy="90" r="7" fill="#ffffff"/>
  </g>

  <!-- Security Shield & Key (RBAC badge) -->
  <rect x="290" y="42" width="220" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
  <text x="400" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">
    JWT AUTH • RBAC ENGINE
  </text>

  <!-- Title & Subtitle -->
  <text x="400" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="800" fill="#ffffff" text-anchor="middle">
    Food Ordering &amp; Operations Platform
  </text>
  <text x="400" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#94a3b8" text-anchor="middle">
    Domino's-Inspired MERN Stack • Role-Based Access Control • Order Workflows
  </text>
</svg>
